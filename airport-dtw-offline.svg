<text x="125" y="688" font-family="Arial" font-size="26" font-weight="bold" fill="#14344a">RECHECK BAG IF REQUIRED</text>
<text x="125" y="723" font-family="Arial" font-size="19" fill="#475569">Use airline connecting baggage desk if directed</text>
<path d="M390 764 v23" stroke="#277e8b" stroke-width="5"/><path d="M378 781 l12 12 l12 -12" fill="none" stroke="#277e8b" stroke-width="5"/>
