<text x="125" y="1019" font-family="Arial" font-size="19" fill="#475569">Find CLE flight on screen and walk to gate</text>
<text x="32" y="1138" font-size="19" font-family="Arial" font-weight="bold" fill="#ad4a26">BAG COLLECTION RULES DEPEND ON CURRENT HANDLING.</text>
<text x="32" y="1170" font-size="16" font-family="Arial" fill="#64748b">Always follow current airline signs, screens and airport staff.</text>
