<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 1198" role="img">
<rect width="780" height="1198" fill="#f8fafc"/>
<text x="32" y="63" font-family="Arial" font-size="33" font-weight="bold" fill="#193954">DETROIT — INTERNATIONAL ARRIVAL</text>
<text x="32" y="104" font-family="Arial" font-size="22" fill="#475569">Paris flight → Cleveland flight</text>
