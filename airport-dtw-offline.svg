<circle cx="76" cy="250" r="28" fill="#1a5d78"/><text x="76" y="259" font-family="Arial" font-size="26" fill="white" font-weight="bold" text-anchor="middle">1</text>
<text x="125" y="244" font-family="Arial" font-size="26" font-weight="bold" fill="#14344a">FOLLOW INTERNATIONAL ARRIVALS</text>
<text x="125" y="279" font-family="Arial" font-size="19" fill="#475569">Go to Passport Control / U.S. Citizens</text>
